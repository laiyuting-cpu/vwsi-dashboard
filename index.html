    case 'dmOpenLink':{if(a.dataset.kind==='todo'){S.drawerDay=S.date;S.drawerTodo=id;S.drawerTask=null;S.modal=null;document.getElementById('overlay').dataset.task='';drawOverlay()}else openTask(id);break}
    case 'tdDel':W(S.db.doc('todos/'+id).delete(),'已刪除');if(S.drawerTodo===id)closeOverlay();break;
    case 'tdOpen':S.drawerDay=a.dataset.day||(S.todos[id]&&!recOf(S.todos[id])?S.todos[id].date:'')||S.date0;S.drawerTodo=id;S.drawerTask=null;S.modal=null;S.richEditing=null;document.getElementById('overlay').dataset.task='';drawOverlay();break;
    case 'richEdit':{S.richEditing=a.dataset.k;S.richLink=null;drawOverlay();const ed=document.getElementById('rich-'+a.dataset.k);if(ed){ed.focus();const r=document.createRange();r.selectNodeContents(ed);r.collapse(false);const sl=window.getSelection();sl.removeAllRanges();sl.addRange(r)}break}
    case 'subDone':{const x=S.todos[id];if(!x)break;const subs=(x.subs||[]).map((z,i)=>i===Number(a.dataset.i)?{...z,done:a.checked}:z);S.todos[id]={...x,subs};W(S.db.doc('todos/'+id).update({subs}));drawOverlay();break}
    case 'subDel':{const x=S.todos[id];if(!x)break;const subs=(x.subs||[]).filter((_,i)=>i!==Number(a.dataset.i));S.todos[id]={...x,subs};W(S.db.doc('todos/'+id).update({subs}));drawOverlay();break}
    case 'tdToDm':{const x=S.todos[id];if(x)addToDaily(x.title,{todoId:id,h:x.hours});break}
    case 'tlMore':S.tlDays=(S.tlDays||30)+30;render();break;
    case 'reschedule':reschedule(S.projectId);break;
    case 'addWp':{const p=S.projects[S.projectId];const wps=projTasks(p.id).filter(t=>t.phase).map(t=>Number(t.code)).filter(n=>!isNaN(n));const code=String((wps.length?Math.max(...wps):0)+1);await W(S.db.collection('tasks').add({projectId:p.id,dept:p.dept,code,title:'新工作包 '+code,phase:true,status:'todo',order:Object.keys(S.tasks).length,createdAt:nowISO(),updatedAt:nowISO()}),'已新增工作包 '+code+'，點任務名稱可改名');break}
    case 'dep':{const t=S.tasks[id];if(!t)break;const set=new Set(t.deps||[]);if(a.checked){if(set.size>=3){a.checked=false;toast('前置任務最多 3 個');break}set.add(a.dataset.d)}else set.delete(a.dataset.d);await W(S.db.doc('tasks/'+id).update({deps:[...set],updatedAt:nowISO()}));reschedule(t.projectId,true);break}
    case 'calCheck':{const el=document.querySelector('[data-mfield=calendarId]');if(el&&el.value.trim()!==(me()?.calendarId||'')){el.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(()=>loadMemberCals(S.date0,true),800)}else loadMemberCals(S.date0,true);toast('檢查中…');break}
    case 'copyBot':navigator.clipboard&&navigator.clipboard.writeText('vwsi-bot@vwsi-dashboard.iam.gserviceaccount.com').then(()=>toast('已複製'));break;
    case 'logout':S.sb.auth.signOut().then(()=>location.reload());break;
    case 'pickAvatar':S.avatarFor=id;document.getElementById('avatarFile').click();break;
    case 'claim':{const m=S.members[id];if(!m||!S.uid)break;if(me()){toast('你已經綁定身分了');break}await W(S.db.doc('members/'+id).update({uid:S.uid}),'歡迎，'+m.name);break}
    case 'unclaim':await W(S.db.doc('members/'+id).update({uid:null}),'已解除綁定');break;
    case 'resolve':await W(S.db.doc('comments/'+id).update({resolved:true,resolvedAt:nowISO()}),'已標記為調整完成');break;
    case 'askDel':S.confirmDel=id;drawOverlay();break;
    case 'cancelDel':S.confirmDel=null;drawOverlay();break;
    case 'delTask':{const ok=await W(S.db.doc('tasks/'+id).delete(),'已刪除任務');if(ok){delete S.tasks[id];closeOverlay();render()}break}
    case 'askDelProject':S.confirmDel='p:'+S.projectId;drawOverlay();break;

    case 'ymode':S.yearMode=a.dataset.v;S.year=null;render();break;

    case 'delGoal':{const g=S.goals[a.dataset.gid];if(!g)break;const items=(g.items||[]).filter((_,i)=>i!==Number(a.dataset.i));await W(S.db.doc('goals/'+a.dataset.gid).set({items}));break}

document.addEventListener('submit',async e=>{

  if(f.dataset.form==='manual'){const mid=f.dataset.id;const data={};MANUAL.forEach(([k])=>data[k]=String(fd.get(k)||'').trim());const bm=String(fd.get('bm')||''),bd=String(fd.get('bd')||'');data.birthday=bm&&bd?bm+'-'+bd:'';data.mbti=String(fd.get('mbti')||'');const kin=Number(fd.get('kin'));data.kin=kin>=1&&kin<=260?kin:null;data.updatedAt=nowISO();const ok=await W(S.db.doc('manuals/'+mid).set(data),'說明書已儲存');if(ok){S.modal='viewManual';drawOverlay()}return}
  if(f.dataset.form==='addTask'){const p=S.projects[S.projectId];const title=String(fd.get('title')).trim();if(!title)return;const wp=String(fd.get('wp')||'');const code=wp?wp+'.'+(projTasks(p.id).filter(t=>!t.phase&&wpOf(t)===wp).length+1):'';const ok=await W(S.db.collection('tasks').add({projectId:p.id,dept:p.dept,code,title,desc:'',owner:String(fd.get('owner')||''),collab:[],due:String(fd.get('due')||''),status:'todo',progress:0,phase:false,order:Object.keys(S.tasks).length,createdAt:nowISO(),updatedAt:nowISO()}),'已新增');if(ok)f.reset();return}
  if(f.dataset.form==='member'){const name=String(fd.get('name')).trim();if(!name)return;const email=String(fd.get('email')||'').trim().toLowerCase();if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Email 格式不正確');return}if(email&&Object.values(S.members).some(x=>(x.email||'').toLowerCase()===email)){toast('這個 Email 已經有人使用');return}const ok=await W(S.db.collection('members').add({name,email,role:String(fd.get('role')||'').trim(),dept:String(fd.get('dept')),kind:String(fd.get('kind')),active:true,uid:null,order:Object.keys(S.members).length,color:COLORS[Object.keys(S.members).length%COLORS.length]}),'已新增 '+name);if(ok)f.reset();return}
  if(f.dataset.form==='goal'){const gid=f.dataset.gid;const g=S.goals[gid]||{items:[]};const items=[...(g.items||[]),{text:String(fd.get('text')).trim(),dept:String(fd.get('dept')),target:Number(fd.get('target'))||0,unit:String(fd.get('unit')||'').trim(),current:0}];const ok=await W(S.db.doc('goals/'+gid).set({items}),'已新增目標');if(ok)f.reset();return}
  if(f.dataset.form==='slackImport'){const xs=[...f.querySelectorAll('[name=imp]:checked')];if(!xs.length){toast('沒有勾選任何頻道');return}f.querySelector('button[type=submit]').disabled=true;let n=0;
    for(const x of xs){const nm=x.dataset.name.replace(/^[a-z][0-9]*[-_.]/i,'')||x.dataset.name;const id='p_'+Date.now().toString(36)+uid8().slice(0,3);if(await W(S.db.doc('projects/'+id).set({name:nm,dept:x.dataset.dept,slackChannel:x.value,slackChannelName:x.dataset.name,status:'active',owner:'',members:[],note:'從 Slack 頻道 #'+x.dataset.name+' 建立',createdAt:nowISO(),updatedAt:nowISO()})))n++}
    toast('已建立 '+n+' 個專案');closeOverlay();return}
  if(f.dataset.form==='project'){
    const edit=S.modal==='editProject';const data={name:String(fd.get('name')).trim(),dept:String(fd.get('dept')),owner:String(fd.get('owner')||''),anchor:String(fd.get('anchor')||''),members:fd.getAll('members').map(String),note:String(fd.get('note')||'').trim(),slackChannel:String(fd.get('slackChannel')||'').trim(),slackChannelName:chName(String(fd.get('slackChannel')||'').trim())||'',updatedAt:nowISO()};
    const tpl=String(fd.get('tpl')||'');const T=S.templates[tpl];
    if(T&&T.timed&&!data.anchor){toast('這個範本需要先填「'+T.anchorLabel+'」');return}
    f.querySelector('button[type=submit]').disabled=true;
    let pid;
    if(edit){pid=S.projectId;const old=S.projects[pid];data.status=String(fd.get('status')||'active');if(data.status==='archived'&&old.status!=='archived')data.closedAt=S.date0;

    }else{
      data.status='active';data.createdAt=nowISO();
      const ref=S.db.collection('projects').doc('p_'+Date.now().toString(36)+uid8().slice(0,3));pid=ref.id;
      if(!await W(ref.set(data)))return;
    }
    if(T){toast('正在產生任務…');const n=await genTasks(pid,tpl,data.anchor,data.dept);toast('已建立 '+n+' 項任務')}else if(!edit)toast('已建立專案');
    closeOverlay();S.view='depts';S.deptSel=data.dept;S.projectId=pid;location.hash='depts';render();
  }
});

let dailyUnsub=null,cmtDayUnsub=null,weekUnsub=null;
function subWeek(days){const key=days.join(',');if(S.wdKey===key||!S.db)return;S.wdKey=key;if(weekUnsub)weekUnsub();S.wdaily={};S.wdLoaded=false;
  weekUnsub=S.db.collection('daily').where('date','in',days).onSnapshot(s=>{const nx={};s.docs.forEach(x=>nx[x.id]=x.data());S.wdaily=nx;S.wdLoaded=true;render()},err)}
function dailyOf(key){return S.daily[key]||S.wdaily[key]||null}
function setDate(d){S.date=d;subDay();render()}
function subDay(){
  if(dailyUnsub)dailyUnsub();if(cmtDayUnsub)cmtDayUnsub();
  const d=S.date,d0=S.date0;const days=d===d0?[d]:[d,d0];
  dailyUnsub=S.db.collection('daily').where('date','in',days).onSnapshot(s=>{for(const k of Object.keys(S.daily))if(days.includes(S.daily[k].date))delete S.daily[k];s.docs.forEach(x=>S.daily[x.id]=x.data());render()},err);
  cmtDayUnsub=S.db.collection('comments').where('day','in',days).onSnapshot(s=>{s.docChanges().forEach(c=>{if(c.type==='removed')delete S.comments[c.doc.id];else S.comments[c.doc.id]={id:c.doc.id,...c.doc.data()}});render()},err);
}
function err(e){console.error(e);if(e&&e.code==='revoked')document.getElementById('main').innerHTML='<div class="banner">你目前無法存取這份資料。</div>'}
function sub(col,key){S.db.collection(col).onSnapshot(s=>{s.docChanges().forEach(c=>{if(c.type==='removed')delete S[key][c.doc.id];else S[key][c.doc.id]={id:c.doc.id,...c.doc.data()}});if(key in S.loaded)S.loaded[key]=true;render();drawOverlay(true)},err)}
async function savePrefs(){try{localStorage.setItem('jj-widgets',JSON.stringify(S.widgets))}catch(_){}if(S.uid){try{await S.db.doc('data/users/'+S.uid+'/prefs').set({widgets:S.widgets})}catch(e){console.warn(e)}}}
async function loadPrefs(){let v=null;try{v=JSON.parse(localStorage.getItem('jj-widgets')||'null')}catch(_){}if(S.uid){try{const d=await S.db.doc('data/users/'+S.uid+'/prefs').get();if(d.exists&&Array.isArray(d.data().widgets))v=d.data().widgets}catch(_){}}if(Array.isArray(v))S.widgets=v.map(w=>w==='waiting'?'pending':w).filter(w=>WIDGETS[w])}

async function boot(){
  const v=location.hash.slice(1);if(v&&!v.includes('access_token')&&!v.includes('error'))S.view=v;
  const C=window.VW_CONFIG;
  if(!window.supabase||!C){document.getElementById('main').innerHTML='<div class="banner">載入失敗，請檢查網路後重新整理。</div>';return}
  const sb=window.supabase.createClient(C.supabaseUrl,C.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  S.sb=sb;
  const {data:{session}}=await sb.auth.getSession();
  if(location.search.includes('code=')||location.hash.includes('access_token'))history.replaceState(null,'',location.pathname+(S.view&&S.view!=='overview'?'#'+S.view:''));
  if(!session){
    gate('<h1>職掘工作台</h1><p class="sub" style="margin:0">用公司的 Google 帳號登入</p><button class="gbtn" id="gLogin">'+G_ICON+'使用 Google 登入</button><p class="hint" style="margin:0">登入後會用你的 Email 對應到夥伴名單。<br>還不在名單裡的話，請營運長到「設定」加入你的 Email。</p>');
    document.getElementById('gLogin').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});
    return;
  }
  S.uid=session.user.id;S.email=session.user.email||'';
  const {data:mid,error:ce}=await sb.rpc('claim_me');
  if(ce){gate('<h1>連線發生問題</h1><p class="sub">'+esc(ce.message||'')+'</p><button class="btn" onclick="location.reload()">重新整理</button>');return}
  if(!mid){
    gate('<h1>還沒有你的名單</h1><p class="sub" style="margin:0">你用 <b>'+esc(S.email)+'</b> 登入，但夥伴名單裡沒有這個 Email。</p><p class="hint" style="margin:0">請營運長或執行長到「設定 → 成員」填入這個 Email，再重新整理。<br>如果你有公司帳號，請改用公司帳號登入。</p><div style="display:flex;gap:8px"><button class="btn" onclick="location.reload()">重新整理</button><button class="btn ghost" id="gOut">換一個帳號</button></div>');
    document.getElementById('gOut').onclick=()=>sb.auth.signOut().then(()=>location.reload());
    return;
  }
  S.gate=false;
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
  S.db=window.VW.makeDb(sb);S.owner=false;S.canWriteKnown=true;
  S.assets=window.VW.makeAssets(sb,S.uid,C.avatarBucket||'avatars');
  render();
  await loadPrefs();
  ['members','depts','projects','tasks','templates','goals','manuals','todos'].forEach(k=>sub(k,k));
  subDay();
  setTimeout(()=>{if(!ready()){Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);render()}},8000);
  setInterval(()=>{const t=today();if(t!==S.date0){const follow=S.date===S.date0;S.date0=t;if(follow)S.date=t;subDay();render()}},60000);
}
boot();
