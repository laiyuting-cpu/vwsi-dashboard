<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>職掘工作台</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-R.woff2") format("woff2");font-weight:100 550;font-display:swap}
@font-face{font-family:"GenSen Rounded";src:url("fonts/gensen-B.woff2") format("woff2");font-weight:551 900;font-display:swap}
/* Layout: sticky top bar with view tabs; one working column (max 1280px) of widget panels; task details slide in from the right. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface-2:#eaf0f5; --line:#d6dfe7;
  --ink:#262626; --ink-2:#56606a; --ink-3:#86919b;
  --blue:#006ebf; --blue-soft:#dcebf7; --on-blue:#ffffff;
  --yellow:#ffe116; --yellow-ink:#262626; --hl:rgba(255,225,22,.55);
  --red:#c8372d; --red-soft:#fbe4e1; --amber:#b86e00; --amber-soft:#fdf0d9; --green:#1e8a4c; --green-soft:#dff2e6; --violet:#6a4bb8; --violet-soft:#ece6f8;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.06);
  --c-proj:#006ebf; --c-todo:#c98a00; --c-meet:#8a96a3;
  --f-body:"GenSen Rounded","源泉圓體","GenSenRounded2 TW","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171c; --surface:#1a2027; --surface-2:#222a33; --line:#2f3943;
  --ink:#ecf0f3; --ink-2:#aab4bd; --ink-3:#7b8792;
  --blue:#4ea3e6; --blue-soft:#163246; --on-blue:#0b1620;
  --yellow:#ffe116; --yellow-ink:#262626; --hl:rgba(255,225,22,.28);
  --red:#ff7a6e; --red-soft:#3a1d1b; --amber:#f2b34d; --amber-soft:#36290f; --green:#5fd08f; --green-soft:#16301f; --violet:#b39cf2; --violet-soft:#2a2340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --c-proj:#3d8fd6; --c-todo:#b07c10; --c-meet:#6f7b86; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2027; --surface-2:#222a33; --line:#2f3943;
  --ink:#ecf0f3; --ink-2:#aab4bd; --ink-3:#7b8792;
  --blue:#4ea3e6; --blue-soft:#163246; --on-blue:#0b1620;
  --yellow:#ffe116; --yellow-ink:#262626; --hl:rgba(255,225,22,.28);
  --red:#ff7a6e; --red-soft:#3a1d1b; --amber:#f2b34d; --amber-soft:#36290f; --green:#5fd08f; --green-soft:#16301f; --violet:#b39cf2; --violet-soft:#2a2340;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --c-proj:#3d8fd6; --c-todo:#b07c10; --c-meet:#6f7b86; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--blue);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--yellow);border:2px solid var(--surface)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.tabs a{padding:7px 12px;border-radius:8px;color:var(--ink-2);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:700}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
main{padding-block:20px 60px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.banner b{font-weight:700}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;font-weight:900;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:15px;font-weight:700;margin:0}
.sub{color:var(--ink-2);font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel.wide{grid-column:1/-1}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-h .count{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.panel-b{padding:6px 0}
.panel-b.pad{padding:12px 14px}
.empty{padding:18px 14px;color:var(--ink-3);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--surface-2);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row .meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;font-weight:500}
.s-todo{background:var(--surface-2);color:var(--ink-2)}
.s-doing{background:var(--blue-soft);color:var(--blue)}
.s-wait{background:var(--violet-soft);color:var(--violet)}
.s-done{background:var(--green-soft);color:var(--green)}
.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--ink-2)}
.due.over{color:var(--red);font-weight:600}
.due.soon{color:var(--amber);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chip .avatar{width:18px;height:18px;font-size:10px}
.dept-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.load-row{display:grid;grid-template-columns:minmax(80px,120px) 1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--surface-2)}
.load-row:first-child{border-top:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);padding:8px 14px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* daily mission */
.dm-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));align-items:start}
.dm{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.dm.me{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--shadow)}
.dm-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dm-h .name{font-weight:700;flex:1;min-width:0}
.dm-items{list-style:none;margin:0;padding:6px 0}
.dm-items li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:6px 12px}
.dm-n{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--ink-3);padding-top:2px}
.dm-items li:first-child .dm-text{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.dm-text{overflow-wrap:anywhere;justify-self:start}
.dm-items li.done .dm-text{text-decoration:line-through;color:var(--ink-3);background:none}
.dm-items li.blank .dm-text{color:var(--ink-3)}
.dm-edit{display:flex;flex-direction:column;gap:8px;padding:10px 12px}
.dm-edit .slot{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.dm-c{border-top:1px solid var(--line);padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.cmt{font-size:13px;display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:8px;background:var(--surface-2)}
.cmt.cut{background:var(--amber-soft);border-left:3px solid var(--amber)}
.cmt.resolved{opacity:.6}
.cmt .by{font-size:11px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmt .body{overflow-wrap:anywhere;white-space:pre-wrap}
.cform{display:flex;flex-direction:column;gap:6px}
.cform .line{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tag-cut{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-soft);padding:0 6px;border-radius:4px}
input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-width:0;width:100%}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue);margin:0}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;color:var(--ink-2);font-weight:500}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
/* depts */
.split{display:grid;gap:16px;grid-template-columns:240px 1fr;align-items:start}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.dept-list{display:flex;flex-direction:column;padding:6px}
.dept-list button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;border-radius:8px;text-align:left;width:100%}
.dept-list button:hover{background:var(--surface-2)}
.dept-list button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue);font-weight:700}
.dept-list .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.proj-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);min-width:0}
.proj:hover{border-color:var(--blue)}
.proj .nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.proj .stats{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.proj .stats b{font-family:var(--f-mono);color:var(--ink)}
.phase{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-top:1px solid var(--line);font-weight:700;flex-wrap:wrap}
.phase .code{font-family:var(--f-mono);color:var(--blue)}
.task{display:grid;grid-template-columns:20px 64px minmax(0,1fr) 120px 118px 88px;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--surface-2)}
.task .code{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.task .ttl{cursor:pointer;overflow-wrap:anywhere}
.task .ttl:hover{color:var(--blue)}
.task.done .ttl{color:var(--ink-3);text-decoration:line-through}
.task select,.task input[type=date]{padding:3px 6px;font-size:12px}
.task .role{font-size:11px;color:var(--ink-3)}
@media (max-width:760px){.task{grid-template-columns:20px minmax(0,1fr) 118px}.task .code,.task .c-owner,.task .c-status{display:none}}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--surface-2);vertical-align:middle}
th{font-size:12px;color:var(--ink-3);font-weight:500;border-top:0;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue);font-weight:700}
/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:-8px 0 30px rgba(0,0,0,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;flex:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow-y:auto;background:var(--surface);z-index:41;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px)}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-mono)}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.2}
.kpi .l{font-size:12px;color:var(--ink-2)}
.loading{padding:40px 0;color:var(--ink-3);text-align:center}
.hint{font-size:12px;color:var(--ink-3)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.drawer.anim{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

.s-decide{background:var(--amber-soft);color:var(--amber)}
.s-blocked{background:var(--red-soft);color:var(--red)}
.s-paused{background:var(--surface-2);color:var(--ink-3)}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.xl{width:88px;height:88px;font-size:32px}
.progress-mini{width:46px;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;display:inline-block;vertical-align:middle}
.progress-mini span{display:block;height:100%;background:var(--green)}
.dm-edit .slot{grid-template-columns:22px 1fr 78px}
.dm-sum{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap}
.dm-h .h{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.badge-ok{font-size:11px;font-weight:700;color:var(--green);background:var(--green-soft);padding:0 6px;border-radius:4px}
.badge-warn{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);padding:0 6px;border-radius:4px}
.cal{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-top:1px solid var(--line);font-size:12px}
.cal .ev{display:grid;grid-template-columns:86px 1fr;gap:8px}
.cal .ev .tm{font-family:var(--f-mono);color:var(--ink-3)}
.manual-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);cursor:pointer;text-align:left;min-width:0}
.mcard:hover{border-color:var(--blue)}
.mcard .top{display:flex;gap:12px;align-items:center}
.mcard .nm{font-weight:700;font-size:16px}
.mcard .quote{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere;background:linear-gradient(transparent 60%,var(--hl) 60%);justify-self:start}
.mcard .empty-m{font-size:13px;color:var(--ink-3)}
.mfield{display:flex;flex-direction:column;gap:2px}
.mfield h3{font-size:12px;color:var(--blue);margin:0;font-weight:700;letter-spacing:.04em}
.mfield p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.linkrow{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.linkrow a{color:var(--blue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.collab{display:flex;flex-wrap:wrap;gap:8px}
.perm{font-size:11px;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.perm.admin{background:var(--blue-soft);color:var(--blue)}
.perm.lead{background:var(--violet-soft);color:var(--violet)}
input[type=range]{width:100%;accent-color:var(--green)}

.brand-logo{width:30px;height:30px;flex:none}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.illo{display:block;height:auto;max-width:100%;pointer-events:none;user-select:none}
.illo.sm{width:150px}.illo.md{width:210px}
.empty-illo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 14px;color:var(--ink-3);font-size:13px;text-align:center}
.empty-illo .illo{width:150px;opacity:.95}
@media (max-width:640px){.hero .illo{display:none}}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs2 button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs2 button[aria-pressed="true"]{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.prio{font-size:11px;font-weight:700;padding:0 6px;border-radius:4px}
.prio.p-高{background:var(--red-soft);color:var(--red)}.prio.p-中{background:var(--amber-soft);color:var(--amber)}.prio.p-低{background:var(--surface-2);color:var(--ink-3)}
.tid{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.health{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap}
.h-完成{background:var(--green-soft);color:var(--green)}.h-正常{background:var(--blue-soft);color:var(--blue)}.h-落後{background:var(--amber-soft);color:var(--amber)}.h-逾期{background:var(--red-soft);color:var(--red)}.h-未開始{background:var(--surface-2);color:var(--ink-3)}
.gantt{display:grid;grid-template-columns:minmax(160px,260px) minmax(0,1fr);border-top:1px solid var(--line)}
.gantt .names{border-right:1px solid var(--line)}
.gantt .names div{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--surface-2)}
.gantt .names div.wp{font-weight:700;background:var(--surface-2)}
.gantt .names .gh{height:40px;border-bottom:1px solid var(--line)}
.gantt .tl{overflow-x:auto}
.gantt svg text{font-family:var(--f-mono);font-size:10px;fill:var(--ink-3)}
.heat{border-collapse:separate;border-spacing:2px;font-size:11px}
.heat td,.heat th{padding:0;border:0;text-align:center}
.heat th{font-family:var(--f-mono);font-weight:400;color:var(--ink-3);padding:0 1px 2px}
.heat td.c{width:22px;height:22px;border-radius:4px;font-family:var(--f-mono);font-size:10px;color:var(--ink)}
.heat td.nm{text-align:left;padding-right:8px;white-space:nowrap}
.hc0{background:var(--surface-2)}.hc1{background:var(--blue-soft)}.hc2{background:var(--green-soft)}.hc3{background:var(--amber-soft)}.hc4{background:var(--red-soft)}.hcw{background:transparent;outline:1px dashed var(--line);outline-offset:-1px}
.astro{display:flex;flex-wrap:wrap;gap:6px}
.astro span{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.slack-ok{font-size:11px;color:var(--green)}

.dm-top{display:grid;gap:16px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start;margin-bottom:22px}
@media (max-width:860px){.dm-top{grid-template-columns:1fr}}
.mine{border:2px solid var(--blue);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.mine-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--blue-soft);flex-wrap:wrap}
.mine-h h2{font-size:17px}
.mine-h .st{margin-left:auto;font-size:12px}
.slot2{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;border-top:1px solid var(--surface-2)}
.slot2:first-of-type{border-top:0}
.num-badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;background:var(--surface-2);color:var(--ink-2);cursor:pointer;border:2px solid transparent;user-select:none}
.num-badge.first{background:var(--yellow);color:var(--yellow-ink)}
.num-badge.done{background:var(--green);color:#fff}
.num-badge input{position:absolute;opacity:0;width:0;height:0}
.slot2 input[type=text]{font-size:15px;padding:9px 12px}
.slot2.is-done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg2 label{padding:6px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg2 input{position:absolute;opacity:0;width:0;height:0}
.seg2 label:has(input:checked){background:var(--blue);color:var(--on-blue);font-weight:700}
.seg2 label:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:-2px}
.mine-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.mine-foot .meter{flex:1;min-width:140px}
.mine-sec{padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.mine-sec h3{margin:0;font-size:13px;font-weight:700}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.strip span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.strip b{font-family:var(--f-mono)}

.wk{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr)) minmax(170px,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto;min-height:420px}
.wk .col{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.wk .col:first-child{border-left:0}
.wk .col.today .dh .n{background:var(--blue);color:var(--on-blue)}
.wk .col.drop{background:var(--blue-soft)}
.wk .col.nodate{background:var(--surface-2)}
.wk .dh{padding:10px 10px 6px;display:flex;flex-direction:column;gap:2px}
.wk .dh .w{font-size:12px;color:var(--ink-3)}
.wk .dh .n{font-size:20px;font-weight:700;font-family:var(--f-mono);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.wk .items{display:flex;flex-direction:column;gap:6px;padding:4px 8px 8px;flex:1}
.td{display:flex;gap:6px;align-items:flex-start;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;line-height:1.4;min-width:0;cursor:grab}
.td.proj{border-left:3px solid var(--blue);cursor:pointer}
.td.proj.over{border-left-color:var(--red)}
.td.done{opacity:.55}.td.done .tt{text-decoration:line-through}
.td .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.td .ctl{display:flex;gap:2px;opacity:0;transition:opacity .1s}
.td:hover .ctl,.td:focus-within .ctl{opacity:1}
.td .ctl button{border:0;background:transparent;padding:0 3px;color:var(--ink-3);font-size:12px}
.td .sub2{font-size:11px;color:var(--ink-3)}
.wk .add{border:0;background:transparent;color:var(--ink-3);padding:6px;border-radius:6px;font-size:13px;text-align:center}
.wk .add:hover{background:var(--surface-2);color:var(--ink)}
.tl-day{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:12px 14px;border-top:1px solid var(--surface-2)}
.tl-day:first-child{border-top:0}
.tl-day .dd{font-weight:700}
.tl-day .dd small{display:block;font-weight:400;color:var(--ink-3);font-size:12px}
.tl-day.today{background:var(--blue-soft)}
.tl-day.over{background:var(--red-soft)}
.tl-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.tl-item{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;cursor:pointer;min-width:0}
.tl-item .k{font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;white-space:nowrap}
.k-dl{background:var(--red-soft);color:var(--red)}.k-st{background:var(--green-soft);color:var(--green)}.k-ms{background:var(--yellow);color:var(--yellow-ink)}.k-dn{background:var(--surface-2);color:var(--ink-3)}
@media (max-width:640px){.tl-day{grid-template-columns:1fr}}

.rich{border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:90px;line-height:1.65;overflow-wrap:anywhere;background:var(--surface);cursor:text}
.rich.view:hover{border-color:var(--ink-3)}
.rich.editing{outline:2px solid var(--blue);outline-offset:-1px}
.rich a{color:var(--blue);text-decoration:underline}
.rich ul,.rich ol{margin:4px 0;padding-left:22px}
.rich p{margin:0 0 6px}
.rich .ph{color:var(--ink-3)}
.rich-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rich-bar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;font-size:13px}
.rich-bar input{flex:1;min-width:160px;padding:3px 8px;font-size:13px}
.subs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.sub-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--surface-2)}
.sub-row input[type=text]{border:0;padding:4px 2px;background:transparent}
.sub-row input[type=text]:focus{background:var(--surface-2)}
.sub-row.done input[type=text]{text-decoration:line-through;color:var(--ink-3)}
.sub-row button{border:0;background:transparent;color:var(--ink-3)}
.act-log{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
.td .meta2{display:flex;gap:6px;font-size:11px;color:var(--ink-3);margin-top:2px;flex-wrap:wrap}
.drawer-title{font-size:20px;font-weight:700;border:1px solid transparent;padding:4px 6px;margin:-4px -6px;border-radius:6px}
.drawer-title:hover,.drawer-title:focus{border-color:var(--line)}

.tb{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tb th{position:sticky;top:0;background:var(--surface);font-size:12px;color:var(--ink-3);font-weight:500;padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tb th.today{color:var(--blue);font-weight:700}
.tb td{vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--surface-2);border-left:1px solid var(--surface-2);min-width:130px}
.tb td.who{border-left:0;min-width:120px;position:sticky;left:0;background:var(--surface);z-index:1}
.tb td.wkend,.tb th.wkend{background:var(--surface-2);min-width:90px}
.tb td.today{background:var(--blue-soft)}
.tcell{display:flex;flex-direction:column;gap:4px}
.titem{display:flex;gap:5px;align-items:flex-start;font-size:12px;line-height:1.35;cursor:pointer;padding:3px 5px;border-radius:5px;border:1px solid var(--line);background:var(--surface);overflow-wrap:anywhere}
.titem.proj{border-left:3px solid var(--c-proj)}
.titem.done{opacity:.5;text-decoration:line-through}
.titem .h{margin-left:auto;font-family:var(--f-mono);color:var(--ink-3);white-space:nowrap}
.hsum{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.hsum.over{color:var(--red);font-weight:700}
.wh td{text-align:center;vertical-align:bottom;min-width:64px}
.wh td.who{text-align:left;vertical-align:middle}
.wh .cellchart{display:flex;flex-direction:column;align-items:center;gap:2px}
.wh .v{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.wh .v.over{color:var(--red);font-weight:700}
.wh tfoot td{font-weight:700;border-top:1px solid var(--line)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}

/* dm stats */
.tb td.who{display:table-cell}
.tb td.num,.tb th.num{min-width:64px;text-align:right}
.titem.cal{border-left:3px solid var(--c-meet);background:var(--surface-2);cursor:default}
.calrow{display:flex;gap:8px;font-size:13px;padding:3px 0}.calrow .tm{font-family:var(--f-mono);color:var(--ink-3);width:92px;flex:none}
.calst{font-size:11px;padding:0 6px;border-radius:4px;white-space:nowrap}.calst.ok{background:var(--green-soft);color:var(--green)}.calst.warn{background:var(--amber-soft);color:var(--amber)}.calst.no{background:var(--surface-2);color:var(--ink-3)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.dmc{display:inline-flex;gap:3px;flex-wrap:wrap;align-items:center}
.dmc i{display:inline-block;height:12px;border-radius:3px;border:1.5px dashed}
.dmc i.h1{width:12px;border-color:var(--c-todo)}.dmc i.h2{width:26px;border-color:var(--c-proj)}
.dmc i.ok{border-style:solid}.dmc i.h1.ok{background:var(--c-todo)}.dmc i.h2.ok{background:var(--c-proj)}
.wbars .dmc{justify-content:center;min-height:16px}
/* recurrence & routines */
.rec-x{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:8px;background:var(--surface-2);margin-top:6px}
.rec-x .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rec-x input[type=number]{width:70px}
.rec-x select{width:auto}
.wdchips{display:flex;gap:4px;flex-wrap:wrap}
.wdchips label{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px}
.wdchips input{position:absolute;opacity:0;width:0;height:0}
.wdchips label:has(input:checked){background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:700}
.wdchips label:has(input:focus-visible){outline:2px solid var(--blue)}
.rec-tag{font-size:11px;color:var(--violet);white-space:nowrap}
.td.span{border-left:3px dashed var(--c-proj);background:var(--surface-2);cursor:pointer}
.td.ghost{border-style:dashed;opacity:.75;cursor:pointer}
.sched-seg{margin-bottom:10px}
.slot2{grid-template-columns:30px 24px minmax(0,1fr) auto}
.dm-ck{width:26px;height:26px;border-radius:7px;border:2px solid var(--ink-3);display:grid;place-items:center;cursor:pointer;background:var(--surface);color:transparent;font-weight:900;font-size:15px;position:relative}
.dm-ck input{position:absolute;opacity:0;width:0;height:0}
.dm-ck:has(input:checked){background:var(--green);border-color:var(--green);color:#fff}
.dm-ck:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.dm-no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.dm-no.first{background:var(--yellow);color:var(--yellow-ink)}
.dm-link{grid-column:3/-1;font-size:12px;color:var(--ink-3);margin-top:-4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dm-link button{border:0;background:transparent;color:var(--blue);padding:0;font-size:12px}
.rt-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--surface-2);min-width:0}
.rt-row:first-of-type{border-top:0}
.rt-row .t{flex:1;min-width:0;overflow-wrap:anywhere;cursor:pointer}
.rt-row.done .t{text-decoration:line-through;color:var(--ink-3)}
.rt-row .k{font-size:11px;padding:0 6px;border-radius:4px;white-space:nowrap}
.k-rt{background:var(--violet-soft);color:var(--violet)}.k-td{background:var(--surface-2);color:var(--ink-2)}.k-pj{background:var(--blue-soft);color:var(--blue)}
.rt-row .star{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.rt-row .star[disabled]{opacity:.5}
/* ---------- mobile ---------- */
.bnav,.bsheet,.only-mob{display:none}
@media (hover:none){.td .ctl{opacity:1}}
@media (max-width:760px){
  .only-desk{display:none!important}
  .only-mob{display:block}
  body{font-size:15px}
  nav.tabs{display:none}
  .top .wrap{padding-block:8px;flex-wrap:nowrap;justify-content:space-between}
  .who span:not(.avatar):not(.perm){display:none}
  .who .avatar{width:32px;height:32px}
  main{padding-block:14px calc(84px + env(safe-area-inset-bottom,0px))}
  h1{font-size:20px}
  .page-head{align-items:flex-start;margin-bottom:12px}
  .page-head .toolbar{width:100%}
  .btn{min-height:40px;padding:8px 14px}
  .btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
  input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px;padding:9px 10px}
  input[type=checkbox]{width:20px;height:20px}
  .row{padding:11px 14px}
  .row.click{flex-wrap:wrap;row-gap:6px}
  .row.click>.main{flex:1 1 calc(100% - 24px)}
  .row.click>.dept-dot{align-self:flex-start;margin-top:8px}
  .row.click>.main~*:nth-child(3){margin-left:18px}
  .panel-h{padding:12px}
  .tabs2 button{padding:10px 14px;font-size:15px}
  .seg button{padding:8px 12px}
  /* bottom nav */
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:0;background:transparent;color:var(--ink-3);text-decoration:none;font-size:11px;font-weight:500;padding:6px 2px}
  .bnav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bnav [aria-current="page"]{color:var(--blue);font-weight:700}
  .bnav [aria-current="page"] svg{stroke-width:2.3}
  .bsheet.open{display:block}
  .bsheet .scrim{z-index:44}
  .bsheet .sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 12px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .bsheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
  .bsheet a{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:16px;font-weight:500}
  .bsheet a[aria-current="page"]{background:var(--blue-soft);color:var(--blue);font-weight:700}
  .bsheet a small{margin-left:auto;color:var(--ink-3);font-size:12px;font-weight:400}
  .bsheet svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  /* modal -> bottom sheet, drawer full screen */
  .modal{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
  .drawer{width:100%}
  .drawer-h{padding:10px 12px;position:sticky;top:0;background:var(--surface);z-index:2}
  .drawer-b{padding:14px}
  /* daily mission */
  .slot2{grid-template-columns:30px 24px minmax(0,1fr);padding:12px}
  .slot2 .seg2{grid-column:3;justify-self:start}
  .dm-link{grid-column:3}
  .seg2 label{padding:8px 14px}
  .mine-h,.mine-foot,.mine-sec{padding-inline:12px}
  /* my tasks week -> vertical day list */
  .wk{grid-template-columns:1fr;min-height:0;overflow:visible}
  .wk .col{border-left:0;border-top:1px solid var(--line)}
  .wk .col:first-child{border-top:0}
  .wk .dh{flex-direction:row;align-items:center;gap:10px;padding:10px 12px 4px}
  .wk .dh .n{font-size:16px;width:30px;height:30px;order:-1}
  .wk .dh .w{font-size:14px;color:var(--ink-2)}
  .wk .items{padding:4px 12px 10px}
  .td{font-size:15px;padding:10px;cursor:default}
  .td .ctl button{font-size:15px;padding:2px 6px}
  .wk .add{text-align:left;padding:8px 4px;font-size:14px}
  .mine-hint{display:none}
  /* gantt / tables */
  .gantt{grid-template-columns:120px minmax(0,1fr)}
  .dept-list{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .dept-list button{width:auto;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  .dept-list .n{margin-left:4px}
  .task{padding:10px 12px}
  .tl-day{padding:12px}
  .cal .ev{grid-template-columns:70px 1fr}
  .heat td.c{width:20px;height:20px}
  .rich-bar button{padding:6px 12px;font-size:14px}
  .sub-row{padding:8px 0}
}
/* team mobile */
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--ink-2)}
.daypick button b{font-family:var(--f-mono);font-size:16px;color:var(--ink)}
.daypick button.today{border-color:var(--blue)}
.daypick button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.daypick button[aria-pressed="true"] b{color:var(--on-blue)}
.mcards{display:flex;flex-direction:column;gap:10px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px}
.mc-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mc-h .nm{font-weight:700;flex:1;min-width:0}
.mc .titem{font-size:14px;padding:8px 10px}
.mc .tcell{gap:6px}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:4px}
.wbars .d{font-size:11px;color:var(--ink-3)}

function zodiac(md){if(!md)return '';const [m,d]=md.split('-').map(Number);const z=[[1,20,'摩羯座'],[2,19,'水瓶座'],[3,21,'雙魚座'],[4,20,'牡羊座'],[5,21,'金牛座'],[6,22,'雙子座'],[7,23,'巨蟹座'],[8,23,'獅子座'],[9,23,'處女座'],[10,24,'天秤座'],[11,23,'天蠍座'],[12,22,'射手座'],[12,32,'摩羯座']];for(const [mm,dd,n] of z){if(m<mm||(m===mm&&d<dd))return n}return '摩羯座'}

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ymd(new Date())}
S.date0=today();S.date=S.date0;
function parseD(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
function addMonths(s,n){const d=parseD(s);d.setMonth(d.getMonth()+n);return ymd(d)}
function weekStart(s){const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function weekEnd(s){return addDays(weekStart(s),6)}
function isWeekend(s){const g=parseD(s).getDay();return g===0||g===6}
function toWork(s){while(isWeekend(s))s=addDays(s,1);return s}
function addWork(s,n){s=toWork(s);while(n>0){s=addDays(s,1);if(!isWeekend(s))n--}return s}
function workDays(a,b){let n=0,d=a;while(d<=b){if(!isWeekend(d))n++;d=addDays(d,1)}return n}
/* recurrence */
const REC_PRESETS=[['','不重複'],['wd','每個工作日（一～五）'],['day','每天'],['week','每週'],['week2','每兩週'],['month','每月'],['month2','每兩個月'],['month3','每季（3 個月）'],['month6','每半年'],['year','每年'],['custom','自訂…']];
const WDN='日一二三四五六';
function presetToRec(k,base){const w=base?parseD(base).getDay():1;const m={wd:{unit:'wd',every:1},day:{unit:'day',every:1},week:{unit:'week',every:1,wdays:[w]},week2:{unit:'week',every:2,wdays:[w]},month:{unit:'month',every:1},month2:{unit:'month',every:2},month3:{unit:'month',every:3},month6:{unit:'month',every:6},year:{unit:'year',every:1},custom:{unit:'week',every:1,wdays:[w],custom:true}};return m[k]?JSON.parse(JSON.stringify(m[k])):null}
function recPreset(r){if(!r)return '';if(r.custom)return 'custom';const e=Number(r.every)||1;if(r.unit==='wd')return 'wd';if(r.unit==='day'&&e===1)return 'day';if(r.unit==='week'&&(r.wdays||[]).length<=1){if(e===1)return 'week';if(e===2)return 'week2'}if(r.unit==='month'&&[1,2,3,6].includes(e))return e===1?'month':'month'+e;if(r.unit==='year'&&e===1)return 'year';return 'custom'}
function recOf(x){if(!x)return null;if(x.rec&&x.rec.unit)return x.rec;const r=x.repeat;return r==='daily'?{unit:'wd',every:1}:r==='weekly'?{unit:'week',every:1}:r==='monthly'?{unit:'month',every:1}:null}
function weekStart(s){const d=parseD(s);return addDays(s,-((d.getDay()+6)%7))}
function monthsBetween(a,b){const x=parseD(a),y=parseD(b);return (y.getFullYear()-x.getFullYear())*12+y.getMonth()-x.getMonth()}
function lastDay(s){const d=parseD(s);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()}
function occursOn(r,base,d){if(!r||!base||!d||d<base)return false;if(r.until&&d>r.until)return false;const e=Math.max(1,Number(r.every)||1);const D=parseD(d),B=parseD(base);
  switch(r.unit){case 'wd':return !isWeekend(d);
  case 'day':return diffDays(d,base)%e===0;
  case 'week':{const wd=(r.wdays&&r.wdays.length)?r.wdays:[B.getDay()];if(!wd.includes(D.getDay()))return false;return Math.round(diffDays(weekStart(d),weekStart(base))/7)%e===0}
  case 'month':return D.getDate()===Math.min(B.getDate(),lastDay(d))&&monthsBetween(base,d)%e===0;
  case 'year':return D.getMonth()===B.getMonth()&&D.getDate()===Math.min(B.getDate(),lastDay(d))&&(D.getFullYear()-B.getFullYear())%e===0}
  return false}
function nextOcc(r,base,after){let d=addDays(after<base?addDays(base,-1):after,1);for(let i=0;i<1200;i++){if(occursOn(r,base,d))return d;d=addDays(d,1)}return ''}
function recLabel(r,base){if(!r)return '';const e=Math.max(1,Number(r.every)||1);const B=base?parseD(base):null;let t='';
  if(r.unit==='wd')t='每個工作日';else if(r.unit==='day')t=e===1?'每天':'每 '+e+' 天';
  else if(r.unit==='week'){const wd=(r.wdays&&r.wdays.length?r.wdays:B?[B.getDay()]:[]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)).map(i=>'週'+WDN[i]).join('、');t=(e===1?'每週':e===2?'每兩週':'每 '+e+' 週')+(wd?' '+wd:'')}
  else if(r.unit==='month')t=({1:'每月',2:'每兩個月',3:'每季',6:'每半年'}[e]||'每 '+e+' 個月')+(B?' '+B.getDate()+' 日':'');
  else if(r.unit==='year')t=(e===1?'每年':'每 '+e+' 年')+(B?' '+(B.getMonth()+1)+'/'+B.getDate():'');
  return t+(r.until?'（到 '+fmtD(r.until).split(' ')[0]+'）':'')}
function recEditor(kind,id,r,base,D){
  const k=recPreset(r);
  const sel='<select id="'+kind+'-rec" data-rec="'+kind+'" data-id="'+id+'" '+D+'>'+REC_PRESETS.map(([v,l])=>'<option value="'+v+'" '+(v===k?'selected':'')+'>'+l+'</option>').join('')+'</select>';
  if(!r)return {sel,extra:''};
  let x='<div class="rec-x">';
  if(k==='custom')x+='<div class="line"><span>每</span><input type="number" min="1" max="99" id="'+kind+'-every" data-recf="every" data-rkind="'+kind+'" data-id="'+id+'" value="'+esc(r.every||1)+'" '+D+'><select id="'+kind+'-unit" data-recf="unit" data-rkind="'+kind+'" data-id="'+id+'" '+D+'>'+[['day','天'],['week','週'],['month','個月'],['year','年']].map(([v,l])=>'<option value="'+v+'" '+(r.unit===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
  if(r.unit==='week'){const wd=(r.wdays&&r.wdays.length)?r.wdays:[base?parseD(base).getDay():1];x+='<div class="line"><span class="hint">在哪幾天</span><div class="wdchips">'+[1,2,3,4,5,6,0].map(i=>'<label><input type="checkbox" data-act="recWd" data-rkind="'+kind+'" data-id="'+id+'" data-w="'+i+'" '+(wd.includes(i)?'checked':'')+' '+D+' aria-label="週'+WDN[i]+'">'+WDN[i]+'</label>').join('')+'</div></div>'}
  const nx=base?nextOcc(r,base,addDays(S.date0,-1)):'';
  x+='<div class="line"><span class="hint">重複到（選填）</span><input type="date" id="'+kind+'-until" data-recf="until" data-rkind="'+kind+'" data-id="'+id+'" value="'+esc(r.until||'')+'" style="width:auto" '+D+'></div>';
  x+='<div class="hint">🔁 '+esc(recLabel(r,base))+(nx?'・下一次 '+fmtD(nx):'')+'</div></div>';
  return {sel,extra:x};

function byCode(a,b){const pa=String(a.code||'').split('.').map(Number),pb=String(b.code||'').split('.').map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=pa[i]??-1,y=pb[i]??-1;if(isNaN(x)||isNaN(y))break;if(x!==y)return x-y}return (a.order??0)-(b.order??0)}

const COLORS=['#006ebf','#d0661a','#1e8a4c','#8a4bd0','#c23b6b','#0f8b8d','#6b7a1a','#b8860b','#3d5a99','#a0522d'];

function deptOf(id){return S.depts[id]||{name:'未分類',color:'#86919b'}}
function statusPill(s){return '<span class="pill s-'+esc(s||'todo')+'">'+esc(STATUS[s]||'未開始')+'</span>'}
function dueHtml(t){if(!t.due)return '<span class="due">無期限</span>';const d=diffDays(t.due,S.date0);let cls='';if(t.status!=='done'){if(d<0)cls='over';else if(d<=3)cls='soon'}const extra=t.status!=='done'&&d<0?' · 逾期 '+(-d)+' 天':'';return '<span class="due '+cls+'">'+fmtD(t.due)+extra+'</span>'}
function prog(t){const p=t.status==='done'?100:(Number(t.progress)||0);return p}
function isOpen(t){return t.status!=='done'}

/* ---------- identity, roles & visibility ---------- */
function me(){return Object.values(S.members).find(m=>m.uid&&m.uid===S.uid)||null}
function isAdmin(){const m=me();return S.owner||!!(m&&m.kind==='主管')}
function isLead(dept){const m=me();return !!(m&&S.depts[dept]&&S.depts[dept].head===m.id)}
function canStruct(dept){return S.canWrite&&(isAdmin()||isLead(dept))}
function canWorkOn(t){if(!S.canWrite)return false;const p=S.projects[t.projectId];if(canStruct(p?.dept))return true;const m=me();return !!(m&&(t.owner===m.id||(t.collab||[]).includes(m.id)))}
function roleOf(m){if(m.kind==='主管')return 'admin';if(Object.values(S.depts).some(d=>d.head===m.id))return 'lead';return 'member'}
const ROLE_LABEL={admin:'管理者',lead:'部門主管',member:'一般夥伴'};
function isOutsourced(){const m=me();return !!(m&&m.kind==='委外')}
function visibleProjectIds(){
  const all=Object.keys(S.projects);
  if(!isOutsourced())return new Set(all);
  const m=me();const set=new Set();
  for(const p of Object.values(S.projects)){if(p.owner===m.id||(p.members||[]).includes(m.id))set.add(p.id)}
  for(const t of Object.values(S.tasks)){if(t.owner===m.id||(t.collab||[]).includes(m.id))set.add(t.projectId)}
  return set;
}
function liveTasks(){const vis=visibleProjectIds();return Object.values(S.tasks).filter(t=>!t.phase&&vis.has(t.projectId)&&(S.projects[t.projectId]?.status!=='archived'))}
function activeMembers(){return Object.values(S.members).filter(m=>m.active!==false).sort((a,b)=>KINDS.indexOf(a.kind)-KINDS.indexOf(b.kind)||(a.order??0)-(b.order??0)||a.name.localeCompare(b.name))}
function visibleMembers(){if(isOutsourced())return [me()];return activeMembers()}
function mine(t,mid){return t.owner===mid||(t.collab||[]).includes(mid)}

/* ---------- render scheduling ---------- */
let rq=false,pending=false;
function editing(root){if(composing)return true;const a=document.activeElement;return a&&root.contains(a)&&(a.isContentEditable||a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&/^(text|number|url|search)$/.test(a.type)))}
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;const m=document.getElementById('main');if(editing(m)){pending=true;return}pending=false;draw()})}
document.getElementById('main').addEventListener('focusout',()=>{if(pending)setTimeout(render,60)});
let composing=false;document.addEventListener('compositionstart',()=>{composing=true});document.addEventListener('compositionend',()=>{composing=false;if(pending)setTimeout(render,60)});
function ready(){return S.loaded.members&&S.loaded.depts&&S.loaded.projects&&S.loaded.tasks}

function draw(){
  document.querySelectorAll('#tabs a,#bnav a,#bsheet a').forEach(a=>a.setAttribute('aria-current',a.dataset.view===S.view?'page':'false'));
  {const bm=document.getElementById('bmore');if(bm)bm.setAttribute('aria-current',['team','manuals','year','settings'].includes(S.view)?'page':'false')}
  drawWho();
  const main=document.getElementById('main');
  if(!S.db){if(!S.gate)main.innerHTML='<div class="loading">正在載入…</div>';return}
  if(!ready())return;
  let h=identityBanner();
  if(!S.canWrite)h+='<div class="banner">你目前只能<b>檢視</b>，無法修改。</div>';
  const v=S.view;
  if(v==='overview')h+=viewOverview();
  else if(v==='daily')h+=viewDaily();
  else if(v==='depts')h+=S.projectId&&S.projects[S.projectId]?viewProject():viewDepts();
  else if(v==='mine')h+=viewMine();
  else if(v==='team')h+=viewTeam();
  else if(v==='manuals')h+=viewManuals();
  else if(v==='year')h+=viewYear();
  else if(v==='settings')h+=viewSettings();
  const ae=document.activeElement;const fid=ae&&main.contains(ae)&&ae.id?ae.id:'';let sel=null;try{if(fid&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(_){}
  main.innerHTML=h;
  if(fid){const f=document.getElementById(fid);if(f){try{f.focus({preventScroll:true});if(sel&&f.setSelectionRange)f.setSelectionRange(sel[0],sel[1])}catch(_){}}}
  if(v==='year')loadYear();
  if(v==='daily')loadCal(S.date);
}
function drawWho(){
  const el=document.getElementById('who');const m=me();
  el.innerHTML=(m?avatar(m)+'<span>'+esc(m.name)+'</span><span class="perm '+roleOf(m)+'">'+ROLE_LABEL[roleOf(m)]+'</span>':'')+(S.sb&&S.uid?'<button class="out" data-act="logout" title="登出">登出</button>':'');
}
function identityBanner(){
  if(me())return '';
  if(!S.uid)return '';
  const free=activeMembers().filter(m=>!m.uid);
  if(!free.length)return '<div class="banner">名單裡還沒有你。請營運長到「設定」新增你，你再按「這是我」。</div>';
  return '<div class="banner"><b>你是哪一位？</b><span class="sub">選一次就好，之後會自動認得你。</span>'+free.map(m=>'<button class="btn sm" data-act="claim" data-id="'+esc(m.id)+'">'+avatar(m)+esc(m.name)+'</button>').join('')+'</div>';
}

/* ---------- overview ---------- */
function weekNo(s){const d=parseD(s);const j=new Date(d.getFullYear(),0,1);return Math.ceil(((d-j)/864e5+((j.getDay()+6)%7)+1)/7)}
function viewOverview(){
  const ws=S.widgets.filter(w=>WIDGETS[w]);
  const canNew=S.canWrite&&(isAdmin()||Object.values(S.depts).some(d=>isLead(d.id)));
  const me_=me();const hi=new Date().getHours();const greet=hi<11?'早安':hi<18?'午安':'晚安';
  let h='<div class="page-head hero"><div><div class="eyebrow">'+fmtD(S.date0)+' · 第 '+weekNo(S.date0)+' 週</div><h1>'+(me_?greet+'，'+esc(me_.name.replace(/（.*）/,'')):'營運總覽')+'</h1><div class="toolbar" style="margin-top:10px"><button class="btn" data-act="widgets">調整顯示內容</button>'+(canNew?'<button class="btn primary" data-act="newProject">新增專案</button>':'')+'</div></div>'+'</div>';
  if(!Object.keys(S.projects).length)h+='<div class="banner">還沒有任何專案。按「新增專案」，可以直接套用 WBS 範本產生整套任務。</div>';
  h+='<div class="grid">'+ws.map(widget).join('')+'</div>';
  return h;
}
function panel(title,count,body,opts={}){return '<section class="panel'+(opts.wide?' wide':'')+'"><div class="panel-h"><h2>'+esc(title)+'</h2><span class="count">'+(count??'')+'</span>'+(opts.action||'')+'</div><div class="panel-b">'+body+'</div></section>'}
function taskRow(t,opt={}){
  const p=S.projects[t.projectId];
  const sub=[];if(p)sub.push(esc(p.name));if(PENDING.includes(t.status)&&t.waitingOn)sub.push(esc(PEND_LABEL[t.status]+'：'+t.waitingOn));if(t.next&&!opt.noNext)sub.push('下一步：'+esc(t.next));
  return '<div class="row click" data-act="openTask" data-id="'+esc(t.id)+'"><span class="dept-dot" style="background:'+esc(deptOf(p?.dept).color)+'"></span><div class="main"><div class="t">'+esc(t.title)+'</div><div class="meta">'+sub.map(x=>'<span>'+x+'</span>').join('')+'</div></div>'+(prog(t)&&t.status!=='done'?'<span class="progress-mini" title="'+prog(t)+'%"><span style="width:'+prog(t)+'%"></span></span>':'')+(opt.noOwner?'':chip(t.owner))+(opt.noStatus?'':statusPill(t.status))+dueHtml(opt.follow&&t.nextFollow?{...t,due:t.nextFollow}:t)+'</div>';
}
function empty(t){return '<div class="empty">'+t+'</div>'}
function widget(w){
  const live=liveTasks();const open=live.filter(isOpen).filter(t=>t.status!=='paused');
  const we=weekEnd(S.date0),ws=weekStart(S.date0);
  if(w==='week'){const l=open.filter(t=>t.due&&t.due<=we).sort((a,b)=>a.due.localeCompare(b.due));return panel('本週到期',l.length+' 項',l.length?l.slice(0,40).map(t=>taskRow(t)).join(''):emptyIllo(3,'本週沒有到期的任務，可以喘口氣。'))}
  if(w==='overdue'){const l=open.filter(t=>t.due&&t.due<S.date0).sort((a,b)=>a.due.localeCompare(b.due));return panel('逾期項目',l.length+' 項',l.length?l.map(t=>taskRow(t)).join(''):empty('沒有逾期任務。'))}
  if(w==='unassigned'){const l=open.filter(t=>!t.owner||!S.members[t.owner]).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));return panel('未指派任務',l.length+' 項',l.length?l.slice(0,40).map(t=>taskRow(t,{noOwner:true})).join('')+(l.length>40?empty('還有 '+(l.length-40)+' 項，到各專案頁指派。'):''):empty('每項任務都有負責人。'))}
  if(w==='pending'){
    const l=open.filter(t=>PENDING.includes(t.status));
    const body=PENDING.map(st=>{const g=l.filter(t=>t.status===st).sort((a,b)=>(a.nextFollow||a.due||'9').localeCompare(b.nextFollow||b.due||'9'));if(!g.length)return '';return '<div class="phase" style="font-size:13px">'+statusPill(st)+'<span class="count mono">'+g.length+'</span></div>'+g.map(t=>taskRow(t,{follow:true,noStatus:true,noNext:true})).join('')}).join('');
    return panel('Pending（卡住的事）',l.length+' 項',body||emptyIllo(4,'目前沒有卡住的事。')+(l.length?'<div class="legend">有填下次追蹤日時，日期顯示追蹤日</div>':''));
  }
  if(w==='decide'){const l=open.filter(t=>t.status==='decide');return panel('等待主管決策',l.length+' 項',l.length?l.map(t=>taskRow(t,{noStatus:true})).join(''):empty('沒有等待決策的事。'))}
  if(w==='stale'){const cut=new Date(Date.now()-7*864e5).toISOString();const l=open.filter(t=>t.status==='doing'&&(t.updatedAt||'')<cut);return panel('停滯任務',l.length+' 項',l.length?l.map(t=>taskRow(t)).join('')+'<div class="legend">狀態為進行中，但 7 天以上沒有任何更新</div>':empty('沒有停滯的任務。'))}
  if(w==='doneWeek'){
    const ms=visibleMembers();const done=live.filter(t=>t.status==='done'&&t.doneAt&&t.doneAt.slice(0,10)>=ws);
    const rows=ms.map(m=>({m,n:done.filter(t=>t.owner===m.id).length})).sort((a,b)=>b.n-a.n);const max=Math.max(3,...rows.map(r=>r.n));
    return panel('本週完成',done.length+' 項',rows.map(r=>'<div class="load-row click" data-act="member" data-id="'+esc(r.m.id)+'" style="cursor:pointer"><span class="chip">'+avatar(r.m)+esc(r.m.name)+'</span><div class="bar"><span style="width:'+(r.n/max*100)+'%;background:var(--green)"></span></div><span class="mono">'+r.n+'</span></div>').join(''));
  }
  if(w==='load'){
    const ms=visibleMembers();
    const rows=ms.map(m=>{const ts=open.filter(t=>t.owner===m.id);const over=ts.filter(t=>t.due&&t.due<S.date0).length;const wk=ts.filter(t=>t.due&&t.due>=S.date0&&t.due<=we).length;const pend=ts.filter(t=>PENDING.includes(t.status)).length;const hrs=ts.reduce((s,t)=>s+(t.dur&&t.ratio&&t.start&&t.due?workDays(S.date0>t.start?S.date0:t.start,t.due)*taskHours(t):(Number(t.est)||0))*(1-prog(t)/100),0);return {m,n:ts.length,over,wk,pend,hrs,rest:Math.max(0,ts.length-over-wk)}});
    const max=Math.max(5,...rows.map(r=>r.n));
    const dm=k=>{const d=S.daily[S.date0+'_'+k];const items=(d?.items||[]).filter(i=>i.t);if(!items.length)return '<span class="badge-warn">未填</span>';return '<span class="mono hint">今日 '+items.filter(i=>i.done).length+'/'+items.length+'</span>'};
    const body=rows.map(r=>'<div class="load-row" data-act="member" data-id="'+esc(r.m.id)+'" style="cursor:pointer"><span class="chip" style="min-width:0">'+avatar(r.m)+'<span style="overflow:hidden;text-overflow:ellipsis">'+esc(r.m.name)+'</span></span><div><div class="bar" role="img" aria-label="'+esc(r.m.name)+'：逾期 '+r.over+'，本週 '+r.wk+'，之後 '+r.rest+'"><span style="width:'+(r.over/max*100)+'%;background:var(--red)"></span><span style="width:'+(r.wk/max*100)+'%;background:var(--amber)"></span><span style="width:'+(r.rest/max*100)+'%;background:var(--blue)"></span></div><div class="hint">'+r.n+' 項'+(r.hrs?' · 剩約 '+Math.round(r.hrs)+' 小時':'')+(r.pend?' · Pending '+r.pend:'')+'</div></div>'+dm(r.m.id)+'</div>').join('');
    return panel('各人負載',ms.length+' 人',(body||empty('先到「設定」建立成員名單。'))+'<div class="legend"><span><i style="background:var(--red)"></i>逾期</span><span><i style="background:var(--amber)"></i>本週到期</span><span><i style="background:var(--blue)"></i>之後</span><span>點名字看手上所有的事</span></div>');
  }
  if(w==='daily'){
    const ms=visibleMembers();
    const body=ms.map(m=>{const d=S.daily[S.date0+'_'+m.id];const items=(d?.items||[]).filter(i=>i.t);const cuts=Object.values(S.comments).filter(c=>c.target==='daily:'+S.date0+'_'+m.id&&c.kind==='cut'&&!c.resolved).length;
      return '<div class="row click" data-act="member" data-id="'+esc(m.id)+'"><span class="chip" style="width:96px">'+avatar(m)+esc(m.name)+'</span><div class="main">'+(items.length?items.map((i,n)=>'<div class="t" style="'+(i.done?'text-decoration:line-through;color:var(--ink-3)':'')+'"><span class="mono hint">'+(n+1)+'</span> '+esc(i.t)+(i.h?' <span class="mono hint">'+i.h+'h</span>':'')+'</div>').join(''):'<span class="hint">今天還沒填</span>')+'</div>'+(d?.report?'<span class="badge-ok">已回報</span>':'')+(cuts?'<span class="tag-cut">插隊 '+cuts+'</span>':'')+'</div>'}).join('');
    return panel('今日 Daily Mission',fmtD(S.date0),body||empty('還沒有成員。'));
  }
  if(w==='depts'){
    const vis=visibleProjectIds();const ds=Object.values(S.depts).sort((a,b)=>(a.order??0)-(b.order??0));
    const body=ds.map(d=>{const ps=Object.values(S.projects).filter(p=>p.dept===d.id&&vis.has(p.id)&&p.status!=='archived');if(!ps.length)return '';return '<div class="phase" style="font-size:13px"><span class="dept-dot" style="background:'+esc(d.color)+'"></span>'+esc(d.name)+'</div>'+ps.map(p=>{const pr=progress(p.id);return '<div class="row click" data-act="openProject" data-id="'+esc(p.id)+'"><div class="main"><div class="t">'+esc(p.name)+'</div><div class="bar" style="margin-top:4px"><span style="width:'+pr.pct+'%;background:var(--blue)"></span></div></div><span class="mono hint">'+pr.pct+'%</span>'+(pr.over?'<span class="due over">逾期 '+pr.over+'</span>':'')+'</div>'}).join('')}).join('');
    return panel('部門進度','',body||empty('還沒有進行中的專案。'));
  }
  if(w==='milestones'){
    const vis=visibleProjectIds();const ps=Object.values(S.projects).filter(p=>vis.has(p.id)&&p.anchor&&p.anchor>=S.date0&&diffDays(p.anchor,S.date0)<=60).sort((a,b)=>a.anchor.localeCompare(b.anchor));
    return panel('近期里程碑',ps.length+' 個',ps.map(p=>'<div class="row click" data-act="openProject" data-id="'+esc(p.id)+'"><span class="dept-dot" style="background:'+esc(deptOf(p.dept).color)+'"></span><div class="main"><div class="t">'+esc(p.name)+'</div><div class="meta">'+esc(deptOf(p.dept).name)+'</div></div><span class="due">'+fmtD(p.anchor)+' · 還有 '+diffDays(p.anchor,S.date0)+' 天</span></div>').join('')||empty('60 天內沒有活動或營隊日期。'));
  }
  if(w==='company'){loadCompany();return panel('公司行事曆','未來兩週',companyList(14))}
  if(w==='hours'){return panel('每日工時負荷','未來兩週','<div class="panel-b pad" style="overflow-x:auto">'+heatmap(visibleMembers(),S.date0,14)+'</div><div class="legend"><span><i class="hc1"></i>&lt;80%</span><span><i class="hc2"></i>80–100%</span><span><i class="hc3"></i>100–120% 加班</span><span><i class="hc4"></i>&gt;120%</span><span>包含專案任務（有填工作天數與每天時數）和個人待辦的預估時數</span></div>',{wide:true})}
  if(w==='birthdays'){const mo=S.date0.slice(5,7);const l=visibleMembers().map(m=>({m,b:S.manuals[m.id]?.birthday})).filter(x=>x.b&&x.b.slice(0,2)===mo).sort((a,b)=>a.b.localeCompare(b.b));return panel('本月壽星',l.length+' 位',l.map(x=>'<div class="row click" data-act="viewManual" data-id="'+esc(x.m.id)+'">'+avatar(x.m)+'<div class="main"><div class="t">'+esc(x.m.name)+'</div><div class="meta"><span>'+esc(zodiac(x.b))+'</span></div></div><span class="due">'+Number(x.b.slice(0,2))+'/'+Number(x.b.slice(3))+'</span></div>').join('')||emptyIllo(3,'這個月沒有壽星。到夥伴說明書填上生日吧！'))}
  if(w==='goals'){
    const d=parseD(S.date0);const y=d.getMonth()>=7?d.getFullYear():d.getFullYear()-1;const g=S.goals['y'+y+'s']||S.goals['y'+d.getFullYear()+'c'];const items=g?.items||[];
    return panel('年度目標',items.length+' 項',items.map(it=>{const pct=it.target?Math.min(100,Math.round((it.current||0)/it.target*100)):0;return '<div class="row"><span class="dept-dot" style="background:'+esc(deptOf(it.dept).color)+'"></span><div class="main"><div class="t">'+esc(it.text)+'</div><div class="bar" style="margin-top:4px"><span style="width:'+pct+'%;background:var(--green)"></span></div></div><span class="mono hint">'+pct+'%</span></div>'}).join('')||empty('還沒有年度目標，到「年度回顧」新增。'));
  }
  return '';
}
function progress(pid){const ts=Object.values(S.tasks).filter(t=>t.projectId===pid&&!t.phase);const done=ts.filter(t=>t.status==='done').length;const over=ts.filter(t=>isOpen(t)&&t.due&&t.due<S.date0).length;const pct=ts.length?Math.round(ts.reduce((s,t)=>s+prog(t),0)/ts.length):0;return {total:ts.length,done,over,pct}}

function taskHours(t){const r=Number(t.ratio);if(!r||!t.start||!t.due||t.status==='done'||t.status==='paused')return 0;return HOURS_PER_DAY*r/100}
function heatmap(ms,from,days){
  const ds=[];for(let i=0;i<days;i++)ds.push(addDays(from,i));
  const open=liveTasks().filter(t=>taskHours(t)>0);
  let h='<table class="heat"><thead><tr><th></th>'+ds.map(d=>'<th>'+(d===from?'今':Number(d.slice(8)))+'</th>').join('')+'</tr></thead><tbody>';
  for(const m of ms){const ts=open.filter(t=>t.owner===m.id);h+='<tr><td class="nm"><span class="chip">'+avatar(m)+esc(m.name)+'</span></td>'+ds.map(d=>{if(isWeekend(d))return '<td class="c hcw"></td>';const hr=ts.filter(t=>t.start<=d&&d<=t.due).reduce((s,t)=>s+taskHours(t),0)+Object.values(S.todos).filter(x=>x.owner===m.id&&!x.done&&x.date===d&&x.hours).reduce((s,x)=>s+Number(x.hours),0);const p=hr/HOURS_PER_DAY;const c=hr===0?'hc0':p<.8?'hc1':p<=1?'hc2':p<=1.2?'hc3':'hc4';return '<td class="c '+c+'" title="'+esc(m.name)+' '+d+'：'+Math.round(hr*10)/10+' 小時">'+(hr?Math.round(hr):'')+'</td>'}).join('')+'</tr>'}
  return h+'</tbody></table>';
}
/* ---------- daily ---------- */
function viewDaily(){
  const m=me();const d=S.date;const isToday=d===S.date0;const ms=visibleMembers();
  const filled=ms.filter(x=>(S.daily[d+'_'+x.id]?.items||[]).some(i=>i.t)).length;
  const reported=ms.filter(x=>S.daily[d+'_'+x.id]?.report).length;
  const cuts=Object.values(S.comments).filter(c=>c.kind==='cut'&&!c.resolved&&(c.target||'').startsWith('daily:'+d+'_')).length;

function viewGantt(p,ts){

    if(t.phase){svg+='<rect x="'+x0+'" y="'+(y+10)+'" width="'+w+'" height="8" rx="2" fill="var(--ink-2)"/><rect x="'+x0+'" y="'+(y+10)+'" width="'+(w*sp[2]/100)+'" height="8" rx="2" fill="var(--blue)"/>'}
    else{const over=t.status!=='done'&&t.due<S.date0;svg+='<g data-act="openTask" data-id="'+esc(t.id)+'" style="cursor:pointer"><rect x="'+x0+'" y="'+(y+6)+'" width="'+w+'" height="16" rx="4" fill="'+(over?'var(--red-soft)':'var(--blue-soft)')+'" stroke="'+(over?'var(--red)':'none')+'"/><rect x="'+x0+'" y="'+(y+6)+'" width="'+(w*sp[2]/100)+'" height="16" rx="4" fill="var(--blue)"/><title>'+esc((tids[t.id]||'')+' '+t.title+'｜'+sp[0]+' → '+sp[1]+'｜'+sp[2]+'%')+'</title></g>'}});
  const tx=diffDays(S.date0,min)*DW+DW/2;if(tx>=0&&tx<=W)svg+='<line x1="'+tx+'" x2="'+tx+'" y1="'+HH+'" y2="'+H+'" stroke="var(--yellow)" stroke-width="3"/>';
  svg+='</svg>';
  const names='<div class="names"><div class="gh"></div>'+rows.map(t=>t.phase?'<div class="wp">'+esc(t.code+' '+t.title)+'</div>':'<div data-act="openTask" data-id="'+esc(t.id)+'" style="cursor:pointer"><span class="tid">'+(tids[t.id]||'')+'</span>'+esc(t.title)+'</div>').join('')+'</div>';

function dayHours(mid,d){

/* ---------- member calendars (shared to vwsi-bot) ---------- */
const toMin=s=>Number(s.slice(11,13))*60+Number(s.slice(14,16));
function evRange(e){const a=e.start||{},b=e.end||{};if(a.dateTime)return {allDay:false,s:a.dateTime.slice(0,16),e:(b.dateTime||a.dateTime).slice(0,16)};const sd=(a.date||'').slice(0,10),ed=(b.date||'').slice(0,10);return {allDay:true,sd,ed:ed>sd?ed:addDays(sd,1)}}
function memberEvents(mid,d){const c=S.mcal&&S.mcal.data&&S.mcal.data[mid];if(!c||!c.events)return [];return c.events.filter(e=>{const r=evRange(e);if(r.allDay)return r.sd<=d&&d<r.ed;return r.s.slice(0,10)<=d&&d<=r.e.slice(0,10)&&!(r.e.slice(0,10)===d&&r.e.slice(11,16)==='00:00'&&r.s.slice(0,10)<d)})}
function meetHours(mid,d){let h=0;for(const e of memberEvents(mid,d)){const r=evRange(e);if(r.allDay)continue;const st=r.s.slice(0,10)<d?d+'T00:00':r.s,en=r.e.slice(0,10)>d?d+'T24:00':r.e;const m=toMin(en)-toMin(st);if(m>0)h+=m/60}return Math.min(12,Math.round(h*10)/10)}

}
let yearCache={key:null,cuts:[]};

  const r=yearRange();const key=r.from+r.to;if(yearCache.key===key||!S.db)return;yearCache={key,cuts:[],loading:true};
  try{const snap=await S.db.collection('comments').where('kind','==','cut').get();yearCache.cuts=snap.docs.map(d=>d.data()).filter(c=>(c.day||'')>=r.from&&(c.day||'')<=r.to)}catch(e){console.error(e)}
  yearCache.loading=false;render();
}

/* ---------- rich text ---------- */
function okUrl(u){u=String(u||'').trim();return /^https?:\/\/[^\s<>"']+$/i.test(u)?u:''}
function linkify(text){return esc(text).replace(/(https?:\/\/[^\s<>"']+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>')}
function cleanHtml(html){
  const t=document.createElement('template');t.innerHTML=String(html||'');
  const ok={A:1,B:1,STRONG:1,I:1,EM:1,U:1,BR:1,DIV:1,P:1,UL:1,OL:1,LI:1,SPAN:1};
  const walk=n=>{[...n.childNodes].forEach(c=>{
    if(c.nodeType===1){walk(c);
      if(!ok[c.tagName]){if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|TEMPLATE|SVG|MATH)$/.test(c.tagName))c.remove();else c.replaceWith(...c.childNodes);return}
      if(c.tagName==='SPAN'){c.replaceWith(...c.childNodes);return}
      [...c.attributes].forEach(a=>{if(!(c.tagName==='A'&&a.name==='href'))c.removeAttribute(a.name)});
      if(c.tagName==='A'){const u=okUrl(c.getAttribute('href'));if(!u){c.replaceWith(...c.childNodes);return}c.setAttribute('href',u);c.setAttribute('target','_blank');c.setAttribute('rel','noopener')}
    }else if(c.nodeType!==3)c.remove()})};
  walk(t.content);return t.innerHTML.trim();
}
function richBlock(key,html,editable,placeholder){
  const on=S.richEditing===key&&editable;
  return (on?'<div class="rich-bar" data-richbar="'+esc(key)+'"><button type="button" data-rcmd="bold" title="粗體"><b>B</b></button><button type="button" data-rcmd="insertUnorderedList" title="項目符號">• 清單</button><button type="button" data-rcmd="link" title="把選取的文字變成連結">🔗 連結</button>'+(S.richLink===key?'<input type="text" id="rich-url" placeholder="貼上網址後按 Enter" data-richurl="'+esc(key)+'">':'')+'<span class="hint">選取文字後直接貼上網址，也會變成連結</span></div>':'')+
    '<div class="rich '+(on?'editing':'view')+'" id="rich-'+esc(key)+'" data-rich="'+esc(key)+'" '+(on?'contenteditable="true"':(editable?'data-act="richEdit" data-k="'+esc(key)+'" tabindex="0" role="button" aria-label="編輯描述"':''))+'>'+(html||(on?'':'<span class="ph">'+esc(placeholder||(editable?'點這裡寫描述、備註，可以貼上連結':'沒有描述'))+'</span>'))+'</div>';

  const ed=e.target.closest&&e.target.closest('[data-rich][contenteditable="true"]');if(!ed)return;

  if((field==='start'||field==='due')&&schedMode(t)==='fixed'){const st=field==='start'?value:t.start,du=field==='due'?value:t.due;if(st&&du&&st>du){toast('結束日不能早於開始日');render();drawOverlay();return}patch.dur=st&&du?workDays(st,du)||1:null;patch.sched='fixed';if(field==='due'&&recOf(t)&&!t.recBase)patch.recBase=value}
  if(field==='owner'&&value&&value!==t.owner&&value!==me()?.id){const p=S.projects[t.projectId];slackDM(value,'📌 *你被指派了新任務*｜'+slackId(me()?.id)+' 指派\n「'+t.title+'」（'+(p?.name||'')+'）'+(t.due?'｜期限 '+fmtD(t.due):'')+(t.deliverable?'\n驗收標準：'+t.deliverable:'')+'\n<'+location.origin+location.pathname+'#mine|打開職掘工作台>')}
  if(field==='status'){patch.doneAt=value==='done'?nowISO():null;if(value==='done')patch.progress=100;if(value==='doing'&&!t.start)patch.start=S.date0;
    const rr=recOf(t);if(value==='done'&&rr&&t.due&&!t.recSpawned){const base=t.recBase||t.due;const nd=nextOcc(rr,base,t.due);if(nd){const sh=diffDays(nd,t.due);const nt={...t,due:nd,start:t.start?toWork(addDays(t.start,sh)):'',sched:'fixed',status:'todo',progress:0,doneAt:null,rec:rr,recBase:base,repeat:'',createdAt:nowISO(),updatedAt:nowISO()};if(nt.start>nd)nt.start=nd;delete nt.id;delete nt.recSpawned;delete nt.startMin;patch.recSpawned=true;W(S.db.collection('tasks').add(nt),'🔁 已建立下一次：'+fmtD(nd))}}}
  if(field==='progress'&&value===100&&t.status!=='done'){patch.status='done';patch.doneAt=nowISO()}

async function reschedule(pid,quiet){
  const ts=projTasks(pid).filter(t=>!t.phase);const by={};ts.forEach(t=>by[t.id]=t);const memo={};const p=S.projects[pid];
  const calc=(t,stack=new Set())=>{if(memo[t.id])return memo[t.id];if(!t.dur||schedMode(t)==='fixed'){memo[t.id]={start:t.start,due:t.due};return memo[t.id]}if(stack.has(t.id))return {start:t.start,due:t.due};stack.add(t.id);
    let s=t.startMin||t.start||S.date0;(t.deps||[]).forEach(d=>{const q=by[d];if(!q)return;const r=calc(q,stack);if(r.due){const nx=addWork(r.due,1);if(nx>s)s=nx}});
    s=toWork(s);const e=addWork(s,Math.max(1,t.dur)-1);memo[t.id]={start:s,due:e};return memo[t.id]};
  const ch=[];ts.forEach(t=>{const r=calc(t);if(t.dur&&schedMode(t)!=='fixed'&&(r.start!==t.start||r.due!==t.due))ch.push([t.id,r])});
  for(let i=0;i<ch.length;i+=10)await Promise.all(ch.slice(i,i+10).map(([id,r])=>S.db.doc('tasks/'+id).update({start:r.start,due:r.due,updatedAt:nowISO()}).catch(()=>{})));
  if(!quiet||ch.length)toast(ch.length?'已重新排程 '+ch.length+' 項任務':'排程已是最新');
}

async function setTdDone(id,day,on){const x=S.todos[id];if(!x)return;let patch;if(recOf(x)){const dd={...(x.doneDates||{})};if(on)dd[day]=true;else delete dd[day];const cut=addDays(S.date0,-120);Object.keys(dd).forEach(k=>{if(k<cut)delete dd[k]});patch={doneDates:dd}}else patch={done:on,doneAt:on?nowISO():null};S.todos[id]={...x,...patch};
  const m=me();const key=day+'_'+(m&&m.id);const cur=S.daily[key];if(cur&&m&&x.owner===m.id){const items=(cur.items||[]).map(it=>it.todoId===id&&!!it.done!==on?{...it,done:on}:it);if(JSON.stringify(items)!==JSON.stringify(cur.items)){S.daily[key]={...cur,items,updatedAt:nowISO()};W(S.db.doc('daily/'+key).set(S.daily[key]))}}
  render();drawOverlay(true);await W(S.db.doc('todos/'+id).update(patch))}
async function addToDaily(text,link){const m=me();if(!m)return;const day=S.view==='daily'?S.date:S.date0;const key=day+'_'+m.id;const cur=S.daily[key];const items=[0,1,2].map(i=>({t:'',done:false,h:1,taskId:'',todoId:'',...((cur?.items||[])[i]||{})}));
  if(link&&items.some(i=>(link.todoId&&i.todoId===link.todoId)||(link.taskId&&i.taskId===link.taskId))){toast('已經在三件事裡了');return}
  const idx=items.findIndex(i=>!i.t);if(idx<0){toast('三件事已經填滿了，先清掉一項');return}
  items[idx]={...items[idx],t:text,taskId:link&&link.taskId||'',todoId:link&&link.todoId||'',h:link&&link.h?(link.h>=2?2:1):items[idx].h};
  const body={date:day,memberId:m.id,items,report:cur?.report||null,updatedAt:nowISO()};S.daily[key]=body;render();await W(S.db.doc('daily/'+key).set(body),'已排進'+(day===S.date0?'今天':fmtD(day))+'的三件事（第 '+(idx+1)+' 件）')}
async function addToDaily_old(text){const m=me();if(!m)return;const key=S.date0+'_'+m.id;const cur=S.daily[key];const items=[0,1,2].map(i=>({t:'',done:false,h:1,taskId:'',...((cur?.items||[])[i]||{})}));const idx=items.findIndex(i=>!i.t);if(idx<0){toast('今天的三件事已經填滿了');return}items[idx].t=text;const body={date:S.date0,memberId:m.id,items,report:cur?.report||null,updatedAt:nowISO()};S.daily[key]=body;await W(S.db.doc('daily/'+key).set(body),'已排進今天的三件事（第 '+(idx+1)+' 件）')}

document.addEventListener('click',async e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;const id=a.dataset.id;

  if(a.tagName==='SELECT')return;
  switch(act){
    case 'openTask':openTask(id);break;
    case 'close':closeOverlay();break;
    case 'member':S.modal='member';S.modalMember=id;S.drawerTask=null;drawOverlay();break;
    case 'viewManual':S.modal='viewManual';S.modalMember=id;drawOverlay();break;
    case 'editManual':S.modal='editManual';S.modalMember=id;drawOverlay();break;
    case 'openProject':closeOverlay();S.view='depts';S.projectId=id;S.deptSel=S.projects[id]?.dept;location.hash='depts';render();scrollTo(0,0);break;
    case 'back':S.projectId=null;render();break;
    case 'dept':S.deptSel=id;S.projectId=null;render();break;
    case 'newProject':S.modal='newProject';S.confirmDel=null;loadSlackChannels();drawOverlay();break;
    case 'editProject':S.modal='editProject';S.confirmDel=null;loadSlackChannels();drawOverlay();break;
    case 'chReload':loadSlackChannels(true);break;
    case 'slackImport':S.modal='slackImport';loadSlackChannels(true);drawOverlay();break;
    case 'impAll':document.querySelectorAll('[name=imp]').forEach(x=>x.checked=a.checked);break;
    case 'widgets':S.modal='widgets';drawOverlay();break;
    case 'wtoggle':{const k=a.dataset.k;S.widgets=a.checked?Object.keys(WIDGETS).filter(w=>w===k||S.widgets.includes(w)):S.widgets.filter(w=>w!==k);savePrefs();render();break}
    case 'hideDone':S.hideDone=a.checked;render();break;
    case 'toggleDone':setTaskField(id,'status',a.checked?'done':'doing');break;
    case 'collab':{const t=S.tasks[id];if(!t)break;const set=new Set(t.collab||[]);a.checked?set.add(a.dataset.m):set.delete(a.dataset.m);W(S.db.doc('tasks/'+id).update({collab:[...set],updatedAt:nowISO()}));break}
    case 'dayPrev':await saveDaily();setDate(addDays(S.date,-1));break;
    case 'dayNext':await saveDaily();setDate(addDays(S.date,1));break;
    case 'dayToday':await saveDaily();setDate(S.date0);break;
    case 'dmDone':setTimeout(()=>{saveDaily();render()},0);break;
    case 'dmSave':saveDaily({manual:true});break;
    case 'dmReport':{const note=(document.getElementById('dmr-note')?.value||'').trim();saveDaily({report:{at:localISO(),note}});break}
    case 'calRetry':loadCal(S.date,true);break;
    case 'companyRetry':loadCompany(true);break;
    case 'toCal':{const t=S.tasks[id];if(!t||!S.mcp)break;a.disabled=true;try{await S.mcp.callTool('Google Calendar','create_event',{summary:t.title,startTime:t.due+'T00:00:00',endTime:addDays(t.due,1)+'T00:00:00',allDay:true,description:'職掘工作台｜'+(S.projects[t.projectId]?.name||'')+(t.deliverable?'\n驗收：'+t.deliverable:'')});toast('已加入你的 Google 行事曆')}catch(err){toast(mcpMsg(err,'Google Calendar').error);a.disabled=false}break}
    case 'driveRetry':if(S.driveRes?.q)driveSearch(S.driveRes.q);break;
    case 'addDrive':{const f=S.driveRes?.files?.[Number(a.dataset.i)];if(f){await addLink(id,{title:f.title,url:f.url});S.driveRes=null;drawOverlay()}break}
    case 'delLink':{const t=S.tasks[id];if(!t)break;const links=(t.links||[]).filter((_,i)=>i!==Number(a.dataset.i));W(S.db.doc('tasks/'+id).update({links,updatedAt:nowISO()}));break}
    case 'ptab':S.ptab=a.dataset.v;render();break;
    case 'mtab':S.mtab=a.dataset.v;render();break;
    case 'ttab':S.ttab=a.dataset.v;render();break;
    case 'tday':S.teamDay=a.dataset.v;render();break;
    case 'twPrev':S.teamWeek=addDays(S.teamWeek||S.date0,-7);render();break;
    case 'twNext':S.teamWeek=addDays(S.teamWeek||S.date0,7);render();break;
    case 'twToday':S.teamWeek=S.date0;render();break;
    case 'wkPrev':S.mineWeek=addDays(S.mineWeek||S.date0,-7);render();break;
    case 'wkNext':S.mineWeek=addDays(S.mineWeek||S.date0,7);render();break;
    case 'wkToday':S.mineWeek=S.date0;render();break;
    case 'tdAdd':S.tdAdd=a.dataset.day;S.tdEdit=null;render();setTimeout(()=>document.getElementById('td-new')?.focus(),30);break;
    case 'tdEdit':S.tdEdit=id;S.tdAdd=null;render();setTimeout(()=>{const f=document.getElementById('td-edit');if(f){f.focus();f.select()}},30);break;
    case 'tdDone':setTdDone(id,a.dataset.day||S.drawerDay||S.date0,a.checked);break;

    case 'sched':{const t=S.tasks[id];if(!t)break;const v=a.dataset.v;if(schedMode(t)===v)break;const patch={sched:v,updatedAt:nowISO()};if(v==='auto'&&!t.dur)patch.dur=t.start&&t.due&&t.start<=t.due?workDays(t.start,t.due)||1:1;if(v==='auto'&&!t.startMin&&t.start)patch.startMin=t.start;S.tasks[id]={...t,...patch};drawOverlay();W(S.db.doc('tasks/'+id).update(patch)).then(ok=>{if(ok)reschedule(t.projectId,true)});break}
