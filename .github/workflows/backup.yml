# 每天台灣時間凌晨 3:17 備份 Supabase 資料庫到 Google 共用雲端硬碟，保留 30 天。
# 需要在 GitHub → Settings → Secrets and variables → Actions 設定三個 Secrets：
#   SUPABASE_DB_URL     Supabase → Connect → Session pooler 的連線字串（含密碼）
#   GDRIVE_SA_JSON      Google 服務帳號的 JSON 金鑰（整份貼上）
#   GDRIVE_FOLDER_ID    共用雲端硬碟裡「備份」資料夾的 ID（網址最後那段）
name: Daily backup
on:
  schedule:
    - cron: '17 19 * * *'   # UTC 19:17 = 台灣 03:17
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client and rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common curl
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Dump database
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Taipei date +%Y-%m-%d_%H%M)
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --no-owner --no-privileges --format=custom --file="vwsi-$STAMP.dump"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --schema=public --data-only --inserts --no-owner | gzip -9 > "vwsi-$STAMP.sql.gz"
          ls -la vwsi-*
          test -s "vwsi-$STAMP.dump"
      - name: Upload to Google Drive and prune old backups
        env:
          RCLONE_CONFIG_GD_TYPE: drive
          RCLONE_CONFIG_GD_SCOPE: drive
          RCLONE_CONFIG_GD_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GD_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -uo pipefail
          run() { "$@" > rc.log 2>&1; local c=$?; cat rc.log; if [ $c -ne 0 ]; then echo "::error::rclone 結束碼 $c，輸出 $(wc -l < rc.log) 行"; tail -6 rc.log | python3 -c "import sys; [print('::error::'+l.strip()[:400].replace('%','%25')) for l in sys.stdin if l.strip()]"; exit $c; fi; }
          if ! echo "$RCLONE_CONFIG_GD_SERVICE_ACCOUNT_CREDENTIALS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("::notice::服務帳號", d.get("client_email"))'; then echo "::error::GDRIVE_SA_JSON 不是完整的 JSON，請重新貼上整份 .json 檔內容"; exit 1; fi
          test -n "$RCLONE_CONFIG_GD_ROOT_FOLDER_ID" || { echo "::error::還沒設定 GDRIVE_FOLDER_ID"; exit 1; }
          run rclone lsd gd: --drive-supports-all-drives
          run rclone copy . gd: --include "vwsi-*" --drive-supports-all-drives
          run rclone delete gd: --min-age 30d --include "vwsi-*" --drive-supports-all-drives
          rclone lsl gd: --include "vwsi-*" --drive-supports-all-drives | tail -5 | while read -r l; do echo "::notice::${l}"; done
