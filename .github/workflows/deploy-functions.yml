# 把 supabase/functions 裡的後端程式部署到 Supabase。
# 需要 GitHub Secret：SUPABASE_ACCESS_TOKEN（supabase.com/dashboard/account/tokens 產生）
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']
  workflow_dispatch: {}
permissions:
  contents: read
env:
  PROJECT_REF: pratgdxlgwgjchkvnaum
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::還沒設定 GitHub Secret：SUPABASE_ACCESS_TOKEN"; exit 1; }
          # 排程用的通行碼由存取權杖推導，不需要另外設定
          CRON_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:vwsi-cron" | sha256sum | cut -c1-48)
          supabase secrets set --project-ref "$PROJECT_REF" CRON_SECRET="$CRON_SECRET"
          supabase functions deploy notify   --project-ref "$PROJECT_REF" --use-api --no-verify-jwt   # 函式內自行驗證登入
          supabase functions deploy followup --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
