# 每個工作日台灣時間 09:07 檢查 Pending 任務的追蹤日，到期就發 Slack 提醒。
name: Pending follow-up reminder
on:
  schedule:
    - cron: '7 1 * * 1-5'   # UTC 01:07 = 台灣 09:07，週一到週五
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Call follow-up function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          CRON_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:vwsi-cron" | sha256sum | cut -c1-48)
          curl -fsS -X POST "https://pratgdxlgwgjchkvnaum.supabase.co/functions/v1/followup" -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" -d '{}'
